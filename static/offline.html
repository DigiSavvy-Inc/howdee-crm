<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Offline</title>
		<link rel="icon" href="/icons/icon-192.png" />
		<style>
			:root {
				--bg: #f6f8fa;
				--surface: #ffffff;
				--text: #1f2328;
				--muted: #59636e;
				--border: #d1d9e0;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0d1117;
					--surface: #161b22;
					--text: #e6edf3;
					--muted: #9198a1;
					--border: #3d444d;
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--bg);
				color: var(--text);
			}
			main {
				max-width: 26rem;
				margin: 1.25rem;
				padding: 2rem;
				text-align: center;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 12px;
			}
			h1 {
				font-size: 1.2rem;
				margin: 1rem 0 0.5rem;
			}
			p {
				color: var(--muted);
				line-height: 1.5;
				margin: 0 0 1.25rem;
			}
			button {
				font: inherit;
				padding: 0.4rem 1rem;
				border-radius: 6px;
				border: 1px solid var(--border);
				background: var(--bg);
				color: var(--text);
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" width="56" height="56" />
			<h1>This app is offline</h1>
			<p>The app needs a connection to send or edit. Reconnect and try again.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
		<script>
			window.addEventListener('online', () => location.reload());
		</script>
	</body>
</html>
